<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple WebRTC Meeting</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="title">Simple WebRTC Meeting</div>
        <div id="status" class="status">Not connected</div>
      </header>

      <section id="lobby" class="panel">
        <div class="row">
          <button id="createBtn" class="btn primary" type="button">Create meeting</button>
        </div>

        <div class="divider">or</div>

        <form id="joinForm" class="row">
          <input
            id="codeInput"
            class="input"
            autocomplete="off"
            placeholder="Enter meeting code"
            maxlength="10"
          />
          <button class="btn" type="submit">Join</button>
        </form>

        <div id="meetingInfo" class="meetingInfo hidden"></div>
      </section>

      <section id="meeting" class="panel hidden">
        <div class="controls">
          <div class="codeBadge">
            Code:
            <span id="roomCodeLabel" class="mono"></span>
          </div>
          <button id="screenShareBtn" class="btn" type="button">Share screen</button>
          <button id="leaveBtn" class="btn danger" type="button">Leave</button>
        </div>

        <div class="videos">
          <div class="videoCard">
            <div class="videoLabel">You</div>
            <video id="localVideo" autoplay playsinline muted></video>
          </div>
          <div id="remoteVideos" class="remoteGrid"></div>
        </div>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
