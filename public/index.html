<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple WebRTC Meeting</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="title">Simple WebRTC Meeting</div>
        <div id="status" class="status">Not connected</div>
      </header>

      <section id="auth" class="panel">
        <form id="authForm" class="authForm">
          <div class="authTitle">Continue with email</div>
          <input id="emailInput" class="input" autocomplete="email" placeholder="Email" />
          <div class="roleRow">
            <label class="roleChip">
              <input type="radio" name="role" value="student" checked />
              <span>Student</span>
            </label>
            <label class="roleChip">
              <input type="radio" name="role" value="interviewer" />
              <span>Interviewer</span>
            </label>
          </div>
          <button id="authBtn" class="btn primary" type="submit">Continue</button>
          <div id="authError" class="errorText hidden"></div>
        </form>
      </section>

      <section id="lobby" class="panel">
        <div class="row">
          <button id="createBtn" class="btn primary" type="button">Create meeting</button>
        </div>

        <div class="divider">or</div>

        <form id="joinForm" class="row">
          <input
            id="codeInput"
            class="input"
            autocomplete="off"
            placeholder="Enter meeting code"
            maxlength="10"
          />
          <button class="btn" type="submit">Join</button>
        </form>

        <div id="meetingInfo" class="meetingInfo hidden"></div>
      </section>

      <section id="meeting" class="panel meetingPanel hidden">
        <div class="meetingStage">
          <div class="videoCard localCard" id="localCard">
            <div class="videoLabel">You</div>
            <div id="localOff" class="videoOffOverlay hidden">Camera off</div>
            <video id="localVideo" autoplay playsinline muted></video>
          </div>
          <div id="remoteVideos" class="remoteGrid"></div>
        </div>

        <div class="meetingBar">
          <div class="codePill">
            Code <span id="roomCodeLabel" class="mono"></span>
          </div>
          <div class="meetingBarRight">
            <button id="micBtn" class="controlBtn" type="button">Mic on</button>
            <button id="camBtn" class="controlBtn" type="button">Camera on</button>
            <button id="screenShareBtn" class="controlBtn" type="button">Share screen</button>
            <button id="leaveBtn" class="controlBtn danger" type="button">Leave</button>
          </div>
        </div>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
